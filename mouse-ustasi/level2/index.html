<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouse Ustası – 2. Seviye</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#48b8ee}
#game{position:fixed;inset:0;overflow:hidden;background:#5abbea url("assets/level2_background_clean.png") center/cover no-repeat;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.balloon{
 position:absolute;width:108px;height:147px;z-index:20;cursor:pointer;
 background-repeat:no-repeat;background-position:center;background-size:contain;
 transition:filter .12s,transform .12s;
 will-change:left,top,transform,opacity;
 touch-action:none;
 pointer-events:auto;
}

@keyframes balloonPop{
  0%{transform:scale(1) rotate(0deg);opacity:1;filter:brightness(1)}
  22%{transform:scale(1.18) rotate(-5deg);opacity:1;filter:brightness(1.55) drop-shadow(0 0 30px rgba(255,255,255,.95))}
  45%{transform:scale(1.04) rotate(6deg);opacity:1;filter:brightness(2)}
  68%{transform:scale(.62) rotate(15deg);opacity:.8}
  100%{transform:scale(.03) rotate(30deg);opacity:0}
}
.balloon.pop-animation{animation:balloonPop .52s cubic-bezier(.16,.8,.22,1) forwards !important}
.balloon:hover{transform:scale(1.06);filter:brightness(1.08) drop-shadow(0 0 12px rgba(255,255,255,.7))}
.balloon.popping{pointer-events:none}
#home{
 position:absolute;left:1.3%;top:2%;width:68px;height:68px;border:0;border-radius:50%;
 background:#a56a2d;color:#fff;font-size:34px;z-index:80;cursor:pointer;
 box-shadow:0 5px 0 #754319,0 8px 18px #0003;
}
#timerWrap{
 position:absolute;right:18%;top:2.5%;z-index:80;
 background:#fff;border-radius:24px;padding:9px 18px 10px;
 box-shadow:0 6px 16px #0003;min-width:180px;text-align:center;
}
#timer{font-size:31px;font-weight:900;color:#57351c}
#bar{height:10px;background:#dce8dc;border-radius:10px;overflow:hidden;margin-top:5px}
#barFill{height:100%;width:100%;background:#65db4e;border-radius:10px}
#score{
 position:absolute;right:2.5%;top:2.5%;z-index:80;
 background:#fff;border-radius:24px;padding:14px 24px;
 color:#57351c;font-size:27px;font-weight:900;box-shadow:0 6px 16px #0003;
}
#phase{
 position:absolute;left:50%;top:17%;transform:translateX(-50%);z-index:80;
 background:rgba(255,255,255,.9);padding:8px 22px;border-radius:18px;
 font-size:19px;font-weight:800;color:#4e3523;box-shadow:0 4px 10px #0002;
}
#done{
 position:absolute;pointer-events:auto;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
 background:rgba(12,30,42,.30)
}
.card{
 background:linear-gradient(145deg,#fffbe8,#fff);border:6px solid #ffd34e;
 border-radius:30px;padding:35px 48px;text-align:center;box-shadow:0 20px 55px #0005;
}
.card h2{margin:0;color:#55a33e;font-size:42px}.card p{font-size:24px;color:#654426}
.card button{pointer-events:auto;position:relative;z-index:110;border:0;border-radius:20px;padding:13px 28px;background:#55c83e;color:#fff;font-size:23px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div id="game">
  <button id="home">⌂</button>
  <div id="timerWrap"><div id="timer">00:30</div><div id="bar"><div id="barFill"></div></div></div>
  <div id="score">🎈 <span id="count">0</span></div>
  <div id="phase">Uçan balonlara tıkla ve onları patlat!</div>
  <canvas id="fx"></canvas>
  <div id="done"><div class="card"><h2>🎉 Harika!</h2><p id="result">Balonları patlattın!</p><button id="replay">Tekrar Oyna</button></div></div>
</div>
<script>
const game=document.getElementById('game'),fx=document.getElementById('fx'),ctx=fx.getContext('2d');
const countEl=document.getElementById('count'),timerEl=document.getElementById('timer'),bar=document.getElementById('barFill');
const done=document.getElementById('done'),result=document.getElementById('result');
let count=0,phase=1,startTime=0,spawnTimer=0,balloons=[],running=false;
const TOTAL=60, PHASE1=30, PHASE2=30;
const colors=['yellow','red','blue','pink','green','purple','orange'];

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;
  fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0)
}
addEventListener('resize',resize);resize();

function start(){
  count=0; countEl.textContent='0'; phase=1; running=true;
  done.style.display='none';
  balloons.forEach(b=>b.el.remove()); balloons=[];
  startTime=performance.now();
  clearTimeout(spawnTimer);
  setPhaseText();
  scheduleSpawn(true);
  requestAnimationFrame(loop);
}

function setPhaseText(){
  document.getElementById('phase').textContent =
    phase===1 ? 'Balonlara tıkla ve patlat!' : 'Şimdi balonlar her yöne uçuyor! Yakala!';
}

function scheduleSpawn(first=false){
  if(!running) return;
  const delay = phase===1
    ? (first?80:420+Math.random()*320)
    : 420+Math.random()*360;
  spawnTimer=setTimeout(()=>{
    if(!running) return;
    // Keep a lively but readable number of balloons on screen.
    if(balloons.length<14){
      if(phase===1) createBalloon(3+Math.random()*89,92,'up');
      else createBalloon(5+Math.random()*88,22+Math.random()*58,'free');
    }
    scheduleSpawn(false);
  },delay);
}

function createBalloon(x,y,mode){
  const el=document.createElement('div');
  el.className='balloon';
  const color=colors[Math.floor(Math.random()*colors.length)];
  el.style.backgroundImage=`url("assets/${color}.svg")`;
  el.style.left=x+'vw'; el.style.top=y+'vh';
  game.appendChild(el);

  const b={
    el,x,y,mode,color,
    phase:Math.random()*Math.PI*2,
    vx:0,vy:0,
    speed:0.090+Math.random()*0.040,
    sway:.012+Math.random()*.010,
    rot:0
  };
  if(mode==='free'){
    b.vx=(Math.random()-.5)*.055;
    b.vy=(Math.random()-.5)*.045;
  }
  balloons.push(b);
}



function hitBalloonAt(x,y){
  if(!running) return;
  const stack=document.elementsFromPoint(x,y);
  const el=stack.find(node=>node && node.classList && node.classList.contains('balloon'));
  if(!el) return;
  const b=balloons.find(item=>item.el===el);
  if(b) pop(b);
}

/* Use the document coordinates, so no canvas, UI layer, or animation layer
   can swallow the balloon click. */
document.addEventListener('mousedown',(e)=>{
  if(e.button===0) hitBalloonAt(e.clientX,e.clientY);
});
document.addEventListener('touchstart',(e)=>{
  const t=e.changedTouches && e.changedTouches[0];
  if(t) hitBalloonAt(t.clientX,t.clientY);
},{passive:true});

function pop(b){
  if(!running || !b.el.parentNode || b.popped) return;
  b.popped=true;
  b.el.style.pointerEvents='none';
  const r=b.el.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height*.42);

  b.el.classList.add('pop-animation');

  setTimeout(()=>{
    if(b.el && b.el.parentNode) b.el.remove();
  },540);
  balloons=balloons.filter(x=>x!==b);
  count++;
  countEl.textContent=count;
}

function burst(cx,cy){
  const particles=[], cs=['#fff','#ffe24a','#ff7c8e','#7ee6ff','#a87cff','#ffb63f'];
  for(let i=0;i<34;i++){
    const a=i*Math.PI*2/34+(Math.random()-.5)*.22, sp=2.2+Math.random()*4.5;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      size:3+Math.random()*6,c:cs[i%cs.length],life:1,r:Math.random()*6});
  }
  const st=performance.now();
  function f(now){
    const t=Math.min((now-st)/680,1);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    const rr=10+82*(1-Math.pow(1-t,2));
    ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,255,255,${1-t})`;ctx.lineWidth=5;
    ctx.shadowColor='#fff';ctx.shadowBlur=16;ctx.stroke();ctx.shadowBlur=0;
    particles.forEach(q=>{
      q.x+=q.vx;q.y+=q.vy;q.vy+=.045;q.vx*=.992;q.life=1-t;q.r+=.22;
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.globalAlpha=q.life;
      ctx.fillStyle=q.c;ctx.shadowColor=q.c;ctx.shadowBlur=10;
      ctx.beginPath();
      for(let k=0;k<8;k++){const rr=k%2?q.size*.3:q.size,a=k*Math.PI/4,
        x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.closePath();ctx.fill();ctx.restore();
    });
    if(t<1)requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}

function loop(){
  if(!running)return;
  const elapsed=(performance.now()-startTime)/1000;

  if(elapsed>=PHASE1 && phase===1){
    phase=2;
    setPhaseText();
    clearTimeout(spawnTimer);
    balloons.forEach(b=>{
      if(b.popped)return;
      b.mode='free';
      const a=Math.random()*Math.PI*2;
      const speed=.075+Math.random()*.045;
      b.vx=Math.cos(a)*speed;
      b.vy=Math.sin(a)*speed;
    });
    scheduleSpawn(false);
  }

  const remaining=Math.max(0,TOTAL-elapsed);
  const shown=Math.ceil(remaining);
  timerEl.textContent='00:'+String(shown).padStart(2,'0');
  bar.style.width=(remaining/TOTAL*100)+'%';

  balloons.forEach(b=>{
    if(!b.el.parentNode||b.popped)return;

    if(b.mode==='up'){
      // Faster, buoyant rise with acceleration and gentle side-to-side sway.
      b.y-=b.speed;
      b.x+=Math.sin(elapsed*3.6+b.phase)*b.sway;
      b.rot=Math.sin(elapsed*2.8+b.phase)*5;
      b.el.style.left=b.x+'vw';
      b.el.style.top=b.y+'vh';
      b.el.style.transform=`rotate(${b.rot}deg)`;
      if(b.y<-20){b.el.remove();balloons=balloons.filter(x=>x!==b)}
    }else{
      b.x+=b.vx;
      b.y+=b.vy;
      // Soft curved flight rather than mechanical straight movement.
      b.vx+=Math.sin(elapsed*2.4+b.phase)*.0015;
      b.vy+=Math.cos(elapsed*2.0+b.phase)*.0012;
      b.vx=Math.max(-.115,Math.min(.115,b.vx));
      b.vy=Math.max(-.105,Math.min(.105,b.vy));
      if(b.x<2||b.x>90)b.vx*=-1;
      if(b.y<22||b.y>82)b.vy*=-1;
      b.rot=Math.max(-9,Math.min(9,b.vx*120));
      b.el.style.left=b.x+'vw';
      b.el.style.top=b.y+'vh';
      b.el.style.transform=`rotate(${b.rot}deg)`;
    }
  });

  if(elapsed>=TOTAL){
    running=false;
    clearTimeout(spawnTimer);
    balloons.forEach(b=>b.el.remove());
    balloons=[];
    result.textContent=`60 saniyede ${count} balon patlattın!`;
    done.style.display='none';
    window.parent.postMessage({type:'levelComplete',level:2,score:count},'*');
    return;
  }
  requestAnimationFrame(loop);
}

const replayBtn=document.getElementById('replay');
replayBtn.addEventListener('click',(e)=>{
  e.preventDefault();
  e.stopPropagation();
  start();
});
document.getElementById('home').onclick=()=>window.parent.postMessage({type:'goHome'},'*');
start();
</script>
</body>
</html>
