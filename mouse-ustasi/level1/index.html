<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mouse Ustası — 1. Seviye</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif}
button{font:inherit}
.screen{position:fixed;inset:0;display:none}

/* START: exact 16:9 image, no cover/cropping. */
#startScreen{
 display:block;
 background:#7dc9ef url("assets/start-screen.png") center center / 100% 100% no-repeat;
}

/* LEVEL 1: intentionally calm, no decorative stars at all. */
#level1{
 background:linear-gradient(#54baf0 0%,#91d8f6 48%,#b8e5b0 49%,#79c76d 72%,#63ae5b 100%);
}
.cloud{
 position:absolute;z-index:1;pointer-events:none;
 background:url("assets/cloud_3d.png") center/contain no-repeat;
 filter:drop-shadow(0 7px 10px rgba(74,112,145,.14));
 opacity:.97;
}
.cloud.c1{left:2%;top:10%;width:245px;height:132px;transform:scale(.88)}
.cloud.c2{right:2%;top:18%;width:235px;height:128px;transform:scale(.80)}
.cloud.c3{left:41%;top:8%;width:150px;height:90px;transform:scale(.50);opacity:.65}
#level1:before{
 content:"";position:absolute;left:-5%;right:-5%;bottom:18%;
 height:38%;z-index:0;
 background:
   radial-gradient(ellipse at 22% 70%,#78bf6a 0 27%,transparent 28%),
   radial-gradient(ellipse at 68% 65%,#83c971 0 30%,transparent 31%),
   linear-gradient(180deg,transparent 0 38%,#80c971 39% 100%);
}
#level1:after{
 content:"";position:absolute;left:-5%;right:-5%;bottom:-7%;
 height:31%;z-index:0;
 border-radius:50% 50% 0 0;
 background:linear-gradient(#71be62,#4e9f52);
}

.levelTop{position:absolute;left:50%;top:3%;width:min(440px,42vw);transform:translateX(-50%);z-index:20;text-align:center}
.badge{
 display:inline-block;padding:7px 28px;border-radius:18px;
 background:linear-gradient(#b77738,#78451e);color:white;
 border:4px solid #e8c47a;font-size:22px;font-weight:900;
 box-shadow:0 5px 10px #0003
}
.title{
 margin-top:6px;padding:9px 34px;border-radius:22px;
 background:rgba(255,249,232,.97);border:4px solid #b8793d;
 color:#50321b;font-size:28px;font-weight:900;box-shadow:0 5px 12px #0003
}
.score{
 position:absolute;right:3%;top:4%;z-index:20;
 background:rgba(255,255,255,.95);padding:12px 22px;border-radius:24px;
 color:#53321b;font-size:28px;font-weight:900;box-shadow:0 6px 15px #0003
}
.home{
 position:absolute;left:3%;top:4%;z-index:20;width:58px;height:58px;
 border:0;border-radius:50%;background:#e95b51;color:#fff;font-size:29px;
 cursor:pointer;box-shadow:0 5px 0 #b83f39
}
.instruction{
 position:absolute;left:50%;top:18.5%;transform:translateX(-50%);z-index:20;
 padding:9px 24px;border-radius:20px;background:rgba(255,255,255,.9);
 color:#3e3e3e;font-size:18px;font-weight:800;box-shadow:0 4px 12px #0002
}

/* Clean collectible star, no face. */
.target{
 position:absolute;width:78px;height:78px;z-index:10;cursor:pointer;
 transition:transform .13s ease,filter .13s ease;
}

.exactStar{
 position:absolute;left:0;top:0;width:92px;height:92px;
 object-fit:contain;pointer-events:none;
 filter:drop-shadow(0 6px 8px rgba(164,107,0,.22));
}
.target:hover{transform:scale(1.1);filter:drop-shadow(0 0 14px rgba(255,215,35,.9))}
.star{
 position:absolute;inset:-7px;
 width:92px;height:92px;
 background:
   radial-gradient(circle at 31% 25%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.2) 7% 13%,transparent 14%),
   radial-gradient(circle at 36% 32%,#fffbd2 0 12%,#fff16b 25%,#ffd42a 58%,#f5a900 100%);
 clip-path:polygon(50% 0%,61% 33%,98% 35%,68% 56%,79% 95%,50% 72%,21% 95%,32% 56%,2% 35%,39% 33%);
 border:3px solid #fff4a3;
 filter:drop-shadow(0 6px 5px rgba(163,105,0,.32));
}
.star:before{
 content:"";position:absolute;left:34%;top:40%;width:7px;height:10px;
 border-radius:50%;background:#69451d;
 box-shadow:27px 0 0 #69451d;
}
.star:after{
 content:"";position:absolute;left:39%;top:49%;width:22px;height:11px;
 border-bottom:4px solid #69451d;border-radius:0 0 20px 20px;
}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:100;pointer-events:none}
.complete{
 position:absolute;inset:0;z-index:200;display:none;
 align-items:center;justify-content:center;background:rgba(18,33,45,.28)
}
.card{background:#fffbea;border:6px solid #ffd34e;border-radius:32px;padding:35px 45px;text-align:center;box-shadow:0 20px 55px #0005}
.card h2{margin:0;color:#55a33e;font-size:42px}.card p{font-size:24px;color:#654426}
.card button{border:0;border-radius:20px;padding:13px 28px;background:#55c83e;color:#fff;font-size:23px;font-weight:900;cursor:pointer}

#startPlay{display:block;position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:40;border:0;border-radius:24px;padding:15px 30px;font-size:27px;font-weight:900;color:#fff;background:linear-gradient(#6fe44e,#36b832);box-shadow:0 6px 0 #278b2a,0 9px 18px #0003;cursor:pointer}#startPlay:hover{transform:translateX(-50%) scale(1.04)}
</style>
</head>
<body>
<div id="startScreen" class="screen"><button id="startPlay">1. Seviyeye Başla ▶</button>
</div>

<div id="level1" class="screen">
 <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
 <button id="home" class="home">⌂</button>
 <div class="levelTop">
  <div class="badge">1. Seviye</div>
  <div class="title">Yıldızlara Tıkla!</div>
 </div>
 <div class="instruction">Parlayan yıldızlara tıkla ve onları topla!</div>
 <div class="score">⭐ <span id="score">0</span> / 20</div>
 <canvas id="fx"></canvas>
 <div id="targets"></div>
 <div id="complete" class="complete">
  <div class="card"><h2>🎉 Harika!</h2><p>20 yıldızın tamamını topladın!</p><button id="again">Tekrar Oyna</button></div>
 </div>
</div>

<script>
const startScreen=document.getElementById('startScreen');
const level1=document.getElementById('level1');
const startPlay=document.getElementById('startPlay');
const home=document.getElementById('home');
const again=document.getElementById('again');
const targets=document.getElementById('targets');
const scoreEl=document.getElementById('score');
const complete=document.getElementById('complete');
const canvas=document.getElementById('fx'),ctx=canvas.getContext('2d');
let score=0;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;canvas.height=innerHeight*d;
 canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
 ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize);resize();

function start(){startScreen.style.display='none';level1.style.display='block';newRound()}
function menu(){level1.style.display='none';startScreen.style.display='block';complete.style.display='none'}

function randomPositions(n){
 const out=[];let tries=0;
 while(out.length<n && tries++<10000){
  const p={x:7+Math.random()*86,y:28+Math.random()*57};
  if(out.every(q=>Math.hypot((p.x-q.x)*innerWidth/100,(p.y-q.y)*innerHeight/100)>100)) out.push(p);
 }
 return out;
}
function newRound(){
 score=0;scoreEl.textContent='0';complete.style.display='none';targets.innerHTML='';
 randomPositions(20).forEach(p=>{
  const el=document.createElement('div');el.className='target';
  el.style.left=p.x+'%';el.style.top=p.y+'%';
  el.innerHTML='<img class="exactStar" alt="Yıldız" src="assets/level1_star_exact.png">';
  el.onclick=()=>collect(el);targets.appendChild(el);
 });
}

function collect(el){
 const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 el.style.pointerEvents='none';
 el.animate([
  {transform:'scale(1)',opacity:1,filter:'brightness(1) drop-shadow(0 0 0 transparent)'},
  {transform:'scale(1.28)',opacity:1,filter:'brightness(1.7) drop-shadow(0 0 28px #ffe34f)',offset:.25},
  {transform:'scale(.72)',opacity:.85,filter:'brightness(2.4) drop-shadow(0 0 45px #fff59b)',offset:.7},
  {transform:'scale(.02)',opacity:0,filter:'brightness(3)'}
 ],{duration:700,easing:'cubic-bezier(.15,.8,.22,1)',fill:'forwards'});
 burst(cx,cy);
 setTimeout(()=>el.remove(),730);
 score++;scoreEl.textContent=score;
 if(score===20)setTimeout(()=>{complete.style.display='none';window.parent.postMessage({type:'levelComplete',level:1,score:score},'*')},900);
}

function burst(cx,cy){
 const ps=[],colors=['#fff8a8','#fff','#ffe04a','#ffc928','#ffb300'];
 for(let i=0;i<28;i++){
  const a=i*Math.PI*2/28+(Math.random()-.5)*.2,s=2.2+Math.random()*3.6;
  ps.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,size:3+Math.random()*5,life:1,c:colors[i%colors.length],r:Math.random()*6.28,spin:(Math.random()-.5)*.25});
 }
 const st=performance.now();
 function f(now){
  const t=Math.min((now-st)/760,1);ctx.clearRect(0,0,innerWidth,innerHeight);
  const rr=12+105*(1-(1-t)*(1-t));
  ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.strokeStyle=`rgba(255,238,80,${(1-t)*.95})`;ctx.lineWidth=5;ctx.shadowColor='#FFE95A';ctx.shadowBlur=15;ctx.stroke();ctx.shadowBlur=0;
  ps.forEach(p=>{
   p.x+=p.vx;p.y+=p.vy;p.vx*=.991;p.vy=p.vy*.991+.035;p.life=1-t;p.r+=p.spin;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=12;
   ctx.beginPath();for(let k=0;k<8;k++){const rr2=k%2?p.size*.32:p.size,a=k*Math.PI/4,x=Math.cos(a)*rr2,y=Math.sin(a)*rr2;k?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.restore();
  });
  if(t<1)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight);
 }
 requestAnimationFrame(f);
}
startPlay.onclick=start;
home.onclick=()=>window.parent.postMessage({type:'goHome'},'*');
again.onclick=newRound;

/* Ana sayfadan seçildiğinde bu bölüm doğrudan oyuna başlar. */
if(new URLSearchParams(location.search).get('autostart')==='1') start();
</script>
</body>
</html>
