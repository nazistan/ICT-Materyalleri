<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Klavye Dedektifleri — Çoklu Görevler</title>
<style>
:root{--navy:#17356b;--blue:#1686dc;--pink:#f0448c;--yellow:#ffcf45;--green:#24b94b;--purple:#8d4bd4;--ink:#19345d;--pale:#f3f9ff}
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;padding:0;background:linear-gradient(135deg,#c8eaff,#fdf2ff 52%,#fff0c6);font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink)}
.app{width:min(100vw,1600px);height:100dvh;margin:0 auto;background:#fff;border:4px solid #2384c9;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 0 #1769a9}
header{flex:0 0 auto;min-height:86px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;background:linear-gradient(105deg,#ffe6a4,#f4e6ff,#d9f4ff);border-bottom:3px solid #b8e3ff}.logo{font-size:clamp(25px,3vw,42px);font-weight:1000;line-height:.95;color:#147ce0;text-shadow:2px 3px white,3px 5px #23519a}.logo span{display:block;color:#e63d95;margin-top:7px}.mascots{font-size:clamp(28px,3vw,45px);white-space:nowrap}.tag{background:#eadbff;border:3px solid #bd8aff;border-radius:18px;padding:12px 18px;text-align:center;font-weight:1000;font-size:clamp(18px,2vw,26px);color:#4c2788}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:235px minmax(0,1fr);gap:12px;padding:12px;background:linear-gradient(#f5fbff,#fff8fc);overflow:hidden}.sidebar{min-height:0;overflow:hidden;background:linear-gradient(#d9f2ff,#a8dfff);border:3px solid #68b9ef;border-radius:20px;padding:9px;display:flex;flex-direction:column;gap:6px}.sideTitle{font-size:20px;font-weight:1000;padding:6px;color:#154e93}.level{display:flex;align-items:center;gap:8px;min-height:42px;padding:6px;border-radius:15px;background:#ffffffb8;border:2px solid #b8daf4;color:#6b88a7;font-weight:900;font-size:14px}.level.active{background:linear-gradient(90deg,#fff09b,#ffcf45);border-color:#ffa51b;color:#174276}.level.done{background:#d8ffe2;color:#1f8247}.num{width:31px;height:31px;display:grid;place-items:center;flex:none;border-radius:50%;background:#8cb8db;color:#fff;font-size:17px}.active .num{background:#ff9d17}.done .num{background:#2fbe58}.progress{margin-top:auto;background:#ffffffb8;padding:12px;border-radius:15px;font-weight:900}.bar{height:14px;background:#c6d9e9;border-radius:20px;overflow:hidden;margin-top:8px}.barin{height:100%;width:0;background:linear-gradient(90deg,#47d95c,#17a64b);transition:width .25s}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden} .instruction{flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;border:4px solid #ff9e00;border-radius:20px;background:linear-gradient(110deg,#fff0a0,#ffe05b 50%,#fff1a0);padding:13px 18px 13px 16px;font-weight:1000;text-align:center;font-size:clamp(18px,1.9vw,25px);margin:7px 0 12px;box-shadow:0 5px 0 #d98600,0 0 0 4px #fff2b8,0 0 18px #ffb90088;overflow:visible;isolation:isolate}.instruction::before{content:'GÖREVİN';position:absolute;left:18px;top:-13px;z-index:2;padding:3px 12px;border-radius:9px;background:#f0448c;color:#fff;border:2px solid #fff;font-size:12px;letter-spacing:1px;box-shadow:0 3px 0 #b71e65;animation:labelBob 1.8s ease-in-out infinite}.instructionText{flex:1;min-width:0;background:#fffdf0;border:2px solid #ffc12b;border-radius:13px;padding:9px 12px;color:#142f68;text-shadow:0 1px #fff;box-shadow:inset 0 -3px 0 #ffe9a0,0 2px 0 #e9b42e;line-height:1.2}.instructionSentence{display:block;margin-bottom:6px}.symbolTarget{display:inline-block;padding:3px 14px;border-radius:9px;background:#fff0a8;border:2px solid #f6a800;color:#d92e79;font-size:1.2em;letter-spacing:2px;box-shadow:0 2px 0 #e8a51d;text-shadow:none;white-space:pre-wrap}.instructionText:has(.symbolTarget){font-size:clamp(15px,1.55vw,21px)}.questionCue{position:relative;flex:none;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#ff4d9b,#e9277c);border:3px solid #fff;color:#fff;font-size:34px;font-weight:1000;line-height:1;box-shadow:0 4px 0 #a91b59,0 0 0 4px #ff9fc9;animation:questionPulse 1.05s ease-in-out infinite}.questionCue::after{content:'✦';position:absolute;right:-9px;top:-11px;font-size:22px;color:#f0448c;text-shadow:0 1px #fff;animation:sparkle .85s ease-in-out infinite}.questionCue.left{animation-delay:.2s}@keyframes questionPulse{0%,100%{transform:scale(1);box-shadow:0 3px 0 #d98a00,0 0 0 0 #ffbf3155}50%{transform:scale(1.13);box-shadow:0 3px 0 #d98a00,0 0 0 8px #ffbf3100}}@keyframes sparkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.55}50%{transform:scale(1.25) rotate(25deg);opacity:1}}@keyframes labelBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.taskline{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:34px}.badge{background:var(--pink);color:white;padding:10px 16px;border-radius:15px;font-size:18px;font-weight:1000;white-space:nowrap}.title{font-size:clamp(16px,1.55vw,21px);font-weight:500;color:#173b79}.columns{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:10px;overflow:hidden}.work,.helper{min-width:0;min-height:0;overflow:hidden;border:3px solid #dce8f5;border-radius:18px;background:#fff;padding:11px;box-shadow:0 4px 0 #d9e8f5}.label{font-size:16px;font-weight:1000;color:#216eb3;margin-bottom:8px}.editor{width:100%;height:clamp(105px,22vh,190px);min-height:0;overflow:hidden;border:3px solid #a8d9fa;border-radius:15px;padding:15px;background:#fbfdff;font-size:22px;line-height:1.55;color:#17345e;white-space:pre-wrap;overflow-wrap:anywhere;outline:none}.editor:focus{border-color:#2598ec;box-shadow:0 0 0 3px #d5f0ff}.editor[contenteditable=true]:empty:before{content:attr(data-placeholder);color:#8aa2ba}.editor.target{border-color:#f28ab5;background:#fffafd}.sourcebox{margin-bottom:13px}.sourcebox[hidden],.targetbox[hidden]{display:none}.helper{background:linear-gradient(#f5eaff,#fff8fd);border-color:#dfc6ff}.helper h3{margin:0 0 12px;color:#7036bd;font-size:20px}.keys{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 16px}.key{padding:10px 13px;min-width:48px;text-align:center;border-radius:11px;color:#fff;font-weight:1000;background:linear-gradient(#4b5362,#202938);border:3px solid #aab7c9;box-shadow:0 4px 0 #101828}.plus{font-weight:1000;font-size:23px}.tip{background:#fff3b8;border:2px solid #ffd85a;border-radius:14px;padding:12px;line-height:1.4;font-size:15px}.buttons{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:15px;padding:13px 18px;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 4px 0 #0002}.hint{background:#fff0b6;color:#805500}.send{background:linear-gradient(#60e75b,#20b84c);color:white;flex:1}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0002}.feedback{display:none;margin-top:12px;border-radius:14px;padding:12px;font-size:16px;font-weight:900}.feedback.good{display:block;background:#dcffe7;color:#176c39;border:2px solid #72d990}.feedback.bad{display:block;background:#fff0d6;color:#8c4a00;border:2px solid #ffc35a}.smallnote{font-size:13px;color:#67819b;margin-top:8px}.tabInputs{display:flex;gap:10px}.tabInputs input{min-width:0;width:50%;border:2px solid #a8d9fa;border-radius:12px;padding:12px;font-size:18px}.footer{flex:0 0 32px;height:32px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px;background:#f1faff;border-top:2px solid #d9efff;color:#63809b;font-weight:800;font-size:12px;overflow:hidden}
.deleteSub{font-size:13px;font-weight:1000;color:#8a4bc4;margin:0 0 7px}.deleteProgress{display:flex;gap:5px;margin:0 0 8px}.deleteDot{height:7px;flex:1;border-radius:10px;background:#d8e5f2}.deleteDot.done{background:#2fbe58}.deleteDot.active{background:#ffbf36}
@media(max-height:720px){header{min-height:72px;padding:7px 14px}.logo{font-size:27px}.tag{padding:7px 12px;font-size:17px}.layout{padding:8px;gap:8px;grid-template-columns:205px minmax(0,1fr)}.sidebar{padding:7px;gap:4px}.level{min-height:36px;padding:4px;font-size:12px}.num{width:27px;height:27px;font-size:14px}.sideTitle{font-size:17px;padding:3px}.progress{padding:8px}.instruction{padding:10px 10px 9px;margin:9px 0 7px;font-size:17px;gap:8px}.instruction::before{font-size:10px;top:-11px;left:12px}.instructionText{padding:7px 8px}.questionCue{width:40px;height:40px;font-size:27px;border-width:2px;border-radius:12px}.questionCue::after{font-size:16px;right:-6px;top:-7px}.taskline{margin-bottom:7px}.badge{padding:7px 10px;font-size:15px}.title{font-size:16px;font-weight:500}.columns{grid-template-columns:minmax(0,1fr) 215px;gap:7px}.work,.helper{padding:8px}.label{font-size:13px;margin-bottom:5px}.editor{height:clamp(82px,19vh,135px);padding:10px;font-size:19px}.helper h3{font-size:16px;margin-bottom:6px}.tip{font-size:12px;padding:8px}.keys{margin:7px 0 9px}.key{padding:7px 9px;font-size:13px}.buttons{margin-top:7px}.btn{padding:9px 12px;font-size:15px}.feedback{margin-top:7px;padding:8px;font-size:13px}.footer{flex-basis:26px;height:26px;font-size:11px}}
@media(max-width:900px){.layout{grid-template-columns:185px minmax(0,1fr)}.columns{grid-template-columns:minmax(0,1fr) 190px}.mascots{display:none}.logo{font-size:25px}.tag{font-size:16px;padding:8px}}

</style></head>
<body><div class="app">
<header><div class="logo">🔎 KLAVYE <span>DEDEKTİFLERİ</span></div><div class="tag">Özel Tuşlar<br><small>Görevleri tamamla!</small></div><div class="mascots" aria-label="Dedektif ekibi">🕵️‍♀️ 🤖 🐶</div></header>
<div class="layout"><aside class="sidebar"><div class="sideTitle">🗂️ Görev Dosyaları</div><div id="levels"></div><div class="progress"><div>İlerleme <span id="progressText">0 / 8</span></div><div class="bar"><div id="barin" class="barin"></div></div></div></aside>
<main class="main"><div id="instruction" class="instruction"></div><div class="taskline"><div id="badge" class="badge"></div><div id="title" class="title"></div></div>
<div class="columns"><section class="work">
<div id="sourcebox" class="sourcebox"><div id="sourceLabel" class="label"></div><div id="source" class="editor" contenteditable="true" spellcheck="false"></div><div id="sourceNote" class="smallnote"></div></div>
<div id="targetbox" class="targetbox" hidden><div id="targetLabel" class="label"></div><div id="target" class="editor target" contenteditable="true" spellcheck="false" data-placeholder="Buraya yapıştır..."></div><div id="targetNote" class="smallnote"></div></div>
<div id="tabbox" hidden><div class="label">TAB GÖREVİ · İki alana sırayla bilgi yaz</div><div class="tabInputs"><input id="tab1" placeholder="Adım: Naz" aria-label="Birinci bilgi"><input id="tab2" placeholder="Dersim: Bilişim" aria-label="İkinci bilgi"></div><div class="smallnote">İlk alana yazdıktan sonra TAB tuşuna bas: imleç ikinci alana geçecek.</div></div>
<div class="buttons"><button id="hintBtn" class="btn hint">💡 İpucu</button><button id="sendBtn" class="btn send">➤ Gönder</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div>
</section><aside class="helper"><h3>🧠 Tuş yardımcısı</h3><div id="keys" class="keys"></div><div id="tip" class="tip"></div></aside></div></main></div><div class="footer">Önce dene • Gönder • İpucunu kullan • Dedektifliğe devam et!</div></div>
<script>
const groups = [
 {name:'DELETE',icon:'⌦',title:'İmlecin sağındaki karakteri sil',type:'delete',tasks:[
  {word:'Bilgisayarr',answer:'Bilgisayar',extra:'r',targetIndex:10,pos:'sonunda',instruction:'“Bilgisayarr” kelimesindeki fazladan r harfini sil.'},
  {word:'Klavvye',answer:'Klavye',extra:'v',targetIndex:4,pos:'ortasında',instruction:'“Klavvye” kelimesindeki fazla v harfini sil.'},
  {word:'öğrenmmee',answer:'öğrenmee',extra:'m',targetIndex:6,pos:'ortasında',instruction:'“öğrenmmee” kelimesindeki ikinci fazla m harfini sil.'},
  {word:'bilgisayarımızX',answer:'bilgisayarımız',extra:'X',targetIndex:14,pos:'sonunda',instruction:'Bu görevde X harfi hazır. İmleci X’in hemen soluna getir ve DELETE ile sil.'}
 ]},
 {name:'BACKSPACE',icon:'⌫',title:'İmlecin solundaki karakteri sil',type:'backspace',tasks:[
  {word:'Klavyee',answer:'Klavye',extra:'e',targetIndex:6,instruction:'Kelimenin sonunda fazladan e harfini BACKSPACE ile sil.'},
  {word:'bilgisayyar',answer:'bilgisayar',extra:'y',targetIndex:8,instruction:'“bilgisayyar” kelimesindeki fazla y harfini BACKSPACE ile sil.'},
  {word:'öğrennmek',answer:'öğrenmek',extra:'n',targetIndex:5,instruction:'“öğrennmek” kelimesinin ortasındaki fazla n harfini BACKSPACE ile sil.'},
  {word:'teknolloji',answer:'teknoloji',extra:'l',targetIndex:6,instruction:'“teknolloji” kelimesindeki fazla l harfini BACKSPACE ile sil.'}
 ]},
 {name:'SHIFT',icon:'⇧',title:'SHIFT ile üst karakter yaz',type:'symbols',keys:['SHIFT'],tasks:[
  {symbols:':',instruction:'SHIFT tuşuyla aşağıdaki işareti yaz',hint:'İki nokta üst üste işareti için SHIFT tuşunu kullan.'},
  {symbols:': ;',instruction:'SHIFT tuşuyla aşağıdaki işaretleri belirtilen sırayla yaz',hint:'İki işaretin arasına bir boşluk bırak.'},
  {symbols:'&?%',instruction:'SHIFT tuşuyla aşağıdaki işaretleri belirtilen sırayla yaz',hint:'İşaretleri sırayla yaz ve aralarına boşluk koyma.'},
  {symbols:'(+)! =/'.replace(' ',''),instruction:'SHIFT tuşuyla aşağıdaki işaretleri belirtilen sırayla yaz',hint:'Bütün işaretleri aynı sırayla yaz ve boşluk ekleme.'}
 ]},
 {name:'CTRL · KOPYALA',icon:'⎘',title:'Seç, kopyala ve yapıştır',type:'copy',tasks:[
  {text:'Merhaba dedektif!',instruction:'Cümleyi üstten seçip CTRL + C ile kopyala; alta CTRL + V ile yapıştır.'},
  {text:'Klavye ile yazı yazarız.',instruction:'Bu cümleyi kopyala ve alt alana yapıştır.'},
  {text:'SPACE kelimeleri ayırır.',instruction:'Bu cümleyi kopyala ve alt alana yapıştır.'},
  {text:'Dijital araçları dikkatli kullanırım.',instruction:'Son kopyalama görevi: cümleyi alta aynı şekilde yapıştır.'}
 ]},
 {name:'CTRL · KES',icon:'✂',title:'Kes ve başka yere taşı',type:'cut',tasks:[
  {text:'Ben bir dedektifim.',instruction:'Cümleyi CTRL + X ile kes ve alt alana CTRL + V ile taşı.'},
  {text:'Bilgisayar öğrenmeme yardım eder.',instruction:'Cümleyi üstten kaldırıp alt alana taşı.'},
  {text:'Her tuşun farklı görevi vardır.',instruction:'Cümleyi kes; alt alana yapıştır.'},
  {text:'Dikkatle dener, sonra kontrol ederim.',instruction:'Son taşıma görevi: üst alan boş kalmalı, cümle alt alana gelmeli.'}
 ]},
 {name:'ALT GR',icon:'⌥',title:'ALT GR ile üçüncül karakter yaz',type:'symbols',keys:['ALT GR'],tasks:[
  {symbols:'@',instruction:'1/4 · Yalnızca @ işaretini yaz.',hint:'Türkçe Q klavyede ALT GR + Q ile @ yazılır.'},
  {symbols:'@ €',instruction:'2/4 · Şimdi @ ve € işaretlerini aralarında bir boşlukla yaz.',hint:'ALT GR + Q ile @; ALT GR + E ile € dene. Klavye düzeni etkileyebilir.'},
  {symbols:'@ € £',instruction:'3/4 · Üç işareti sırayla yaz: @ € £',hint:'İşaretler arasında birer boşluk bırak.'},
  {symbols:'@ € £ { } [ ]',instruction:'4/4 · Son görev: @ € £ { } [ ]',hint:'İşaretleri aynı sırayla yaz. Bazı semboller klavye düzenine göre değişebilir; öğretmeninden yardım iste.'}
 ]},
 {name:'TAB',icon:'↹',title:'TAB ile sonraki alana geç',type:'tab',tasks:[
  {a:'Adım: Ada',b:'Sınıfım: 2',instruction:'İlk kutuya Adım: Ada yaz; TAB ile ikinci kutuya geçip Sınıfım: 2 yaz.'},
  {a:'Sevdiğim renk: Mavi',b:'Sevdiğim hayvan: Kedi',instruction:'İki bilgiyi ayrı kutulara yaz. İkinci kutuya TAB ile geç.'},
  {a:'Bugün: Pazartesi',b:'Dersim: Bilişim',instruction:'TAB ile sonraki kutuya geçerek iki bilgiyi tamamla.'},
  {a:'Görev: Tamam',b:'Dedektif: Hazır',instruction:'Son TAB görevi: bilgileri iki ayrı kutuya yerleştir.'}
 ]},
 {name:'ALT',icon:'⌥',title:'ALT tuşunu keşfet',type:'alt',tasks:[
  {answer:'menü',instruction:'ALT bazı programlarda menülere ulaşmaya yardım eder. Gözlem cevabına “menü” yaz.'},
  {answer:'yardımcı',instruction:'ALT çoğu zaman tek başına yazı yazmaz, yardımcı tuştur. “yardımcı” yaz.'},
  {answer:'program',instruction:'ALT’ın davranışı kullanılan programa göre değişebilir. “program” yaz.'},
  {answer:'gözlemledim',instruction:'Öğretmeninle ALT’a basıp gözlemle. Sonra “gözlemledim” yaz.'}
 ]}
];
let groupIndex=0, stepIndex=0, locked=false; const doneGroups=new Set();
const $=id=>document.getElementById(id); const source=$('source'),target=$('target');
function current(){return groups[groupIndex].tasks[stepIndex]}
function normalize(x){return x.normalize('NFC').replace(/\s+/g,' ').trim()}
function renderLevels(){ $('levels').innerHTML=groups.map((g,i)=>`<div class="level ${i===groupIndex?'active':''} ${doneGroups.has(i)?'done':''}"><span class="num">${doneGroups.has(i)?'✓':i+1}</span><span>${g.name}</span>${i>groupIndex?'<span style="margin-left:auto">🔒</span>':''}</div>`).join('');let total=groups.reduce((n,g)=>n+g.tasks.length,0),completed=groups.slice(0,groupIndex).reduce((n,g)=>n+g.tasks.length,0)+stepIndex;$('progressText').textContent=`${completed} / ${total}`;$('barin').style.width=`${completed/total*100}%`;}
function render(){locked=false;const g=groups[groupIndex],t=current();$('instruction').innerHTML='<span class="questionCue left" aria-hidden="true">☝</span><span class="instructionText"></span><span class="questionCue" aria-hidden="true">➜</span>';if(g.name==='SHIFT'){$('instruction').querySelector('.instructionText').innerHTML='';const sentence=document.createElement('span');sentence.className='instructionSentence';sentence.textContent=t.instruction;const target=document.createElement('span');target.className='symbolTarget';target.textContent=t.symbols;$('instruction').querySelector('.instructionText').append(sentence,target);}else{$('instruction').querySelector('.instructionText').textContent=t.instruction;}$('badge').textContent=`${g.name} · ${stepIndex+1}/4`;$('title').textContent=g.title;$('sourcebox').hidden=['tab','alt'].includes(g.type);$('targetbox').hidden=!['copy','cut'].includes(g.type);$('tabbox').hidden=g.type!=='tab';$('sourceLabel').textContent=['copy','cut'].includes(g.type)?(g.type==='copy'?'1 · KOPYALANACAK CÜMLE':'1 · KESİLECEK CÜMLE'):(g.type==='symbols'?'SEMBOL GÖREVİ':g.type==='alt'?'GÖZLEM CEVABI':'DÜZENLEME ALANI');
source.contentEditable='true';source.textContent='';source.dataset.locked='';target.textContent='';$('sourceNote').textContent='';$('targetLabel').textContent='2 · HEDEF ALAN';$('targetNote').textContent='';$('tab1').value='';$('tab2').value='';
if(g.type==='delete'||g.type==='backspace'){source.textContent=t.word;$('sourceNote').textContent='Yalnızca gerekli harfi düzelt; sonra Gönder.';source.dataset.expected=t.answer;source.dataset.mode=g.type;}
else if(g.type==='symbols'){source.textContent='';source.dataset.expected=t.symbols;source.dataset.mode='symbols';}
else if(g.type==='copy'||g.type==='cut'){source.textContent=t.text;source.dataset.expected=t.text;$('target').dataset.expected=t.text;$('targetNote').textContent=g.type==='cut'?'Taşıma sonunda üst alan boş kalmalı.':'Kopyalanan cümle alt alanda görünmeli.';}
else if(g.type==='tab'){ $('tab1').placeholder=t.a;$('tab2').placeholder=t.b; $('tab1').dataset.expected=t.a;$('tab2').dataset.expected=t.b;}
else if(g.type==='alt'){source.textContent='';source.dataset.expected=t.answer;}
$('keys').innerHTML=(g.type==='symbols'?g.keys:g.type==='delete'?['DELETE']:g.type==='backspace'?['BACKSPACE']:g.type==='copy'?['CTRL','+','C','CTRL','+','V']:g.type==='cut'?['CTRL','+','X','CTRL','+','V']:g.type==='tab'?['TAB']:['ALT']).map(k=>k==='+'?'<span class="plus">+</span>':`<span class="key">${k}</span>`).join('');$('tip').textContent=t.hint|| (g.type==='delete'?'DELETE imlecin sağındaki karakteri siler.':g.type==='backspace'?'BACKSPACE imlecin solundaki karakteri siler.':g.type==='symbols'?'Sembolleri sırayla ve tam olarak yaz.':g.type==='copy'?'Üstteki cümleyi seç, CTRL + C; sonra alt alana CTRL + V.':g.type==='cut'?'CTRL + X ile kes, alt alana CTRL + V ile taşı.':g.type==='tab'?'İlk kutudan TAB ile ikinci kutuya geç.':'ALT’ın görevi programa göre değişebilir.');$('feedback').className='feedback';$('feedback').textContent='';$('sendBtn').textContent='➤ Gönder';$('sendBtn').disabled=false;$('hintBtn').disabled=false;
let sub=$('deleteSub');if(sub)sub.remove();let prog=$('deleteProgress');if(prog)prog.remove();if(g.type==='delete'||g.type==='backspace'||g.type==='symbols'){sub=document.createElement('div');sub.id='deleteSub';sub.className='deleteSub';sub.textContent=`Bu bölüm: ${stepIndex+1} / 4`;$('sourcebox').prepend(sub);let dots=document.createElement('div');dots.id='deleteProgress';dots.className='deleteProgress';for(let i=0;i<4;i++){let d=document.createElement('div');d.className='deleteDot'+(i<stepIndex?' done':i===stepIndex?' active':'');dots.appendChild(d)}sub.after(dots);}renderLevels();}
function feedback(ok,msg){$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=msg}
function validate(){const g=groups[groupIndex],t=current();if(g.type==='delete'||g.type==='backspace')return normalize(source.textContent)===normalize(t.answer);if(g.type==='symbols')return normalize(source.textContent)===normalize(t.symbols);if(g.type==='copy')return normalize(target.textContent)===normalize(t.text);if(g.type==='cut')return normalize(source.textContent)===''&&normalize(target.textContent)===normalize(t.text);if(g.type==='tab')return normalize($('tab1').value)===normalize(t.a)&&normalize($('tab2').value)===normalize(t.b);if(g.type==='alt')return normalize(source.textContent).toLocaleLowerCase('tr-TR')===t.answer;return false}
function send(){if(locked)return;if(!validate()){feedback(false,'Henüz olmadı. İpucunu oku, aynı görevde yeniden dene.');return;}if(stepIndex<3){stepIndex++;render();feedback(true,'🎉 Doğru! Bu tuşun sonraki görevine geçtin.');return;}doneGroups.add(groupIndex);locked=true;feedback(true,'🏆 Bu tuşun 4 görevini de tamamladın! Sonraki bölüm açıldı.');renderLevels();$('sendBtn').textContent=groupIndex<groups.length-1?'Sonraki Tuş ➜':'🏆 Bitir';}
$('sendBtn').addEventListener('click',()=>{if(locked){if(groupIndex<groups.length-1){groupIndex++;stepIndex=0;render()}else{$('instruction').innerHTML='<span class="questionCue left" aria-hidden="true">☝</span><span class="instructionText"></span><span class="questionCue" aria-hidden="true">🏆</span>'; $('instruction').querySelector('.instructionText').textContent='Bütün tuşların dört görevini de tamamladın!';$('title').textContent='Dedektiflik tamamlandı 🏆';$('sourcebox').hidden=true;$('targetbox').hidden=true;$('tabbox').hidden=true;$('sendBtn').disabled=true;$('hintBtn').disabled=true;$('tip').textContent='Tebrikler dedektif!';}return;}send()});$('hintBtn').addEventListener('click',()=>feedback(false,'💡 İpucu: '+(current().hint||$('tip').textContent)));
source.addEventListener('keydown',e=>{const g=groups[groupIndex],t=current();if(g.type==='delete'){if(['ArrowLeft','ArrowRight','Home','End','Delete'].includes(e.key)){if(e.key==='Delete'){const sel=getSelection(),node=sel&&sel.anchorNode,off=sel&&sel.anchorOffset;const targetText=t.word;let expectedPos=t.targetIndex;if(!sel||!sel.isCollapsed||node!==source.firstChild||off!==expectedPos){e.preventDefault();feedback(false,'🔒 Yalnızca hedef harfin hemen solunda DELETE kullanabilirsin.');}}return;}e.preventDefault();if(e.key==='Backspace')feedback(false,'Bu görevde BACKSPACE değil DELETE kullan.');return;}
if(g.type==='backspace'){if(['ArrowLeft','ArrowRight','Home','End','Backspace'].includes(e.key)){if(e.key==='Backspace'){const sel=getSelection(),node=sel&&sel.anchorNode,off=sel&&sel.anchorOffset;const correct=sel&&sel.isCollapsed&&node===source.firstChild&&off===t.targetIndex+1;if(!correct){e.preventDefault();feedback(false,'🔒 Yalnızca hedef harfin hemen sağında BACKSPACE kullanabilirsin.');}}return;}e.preventDefault();return;}
});
source.addEventListener('beforeinput',e=>{
 const g=groups[groupIndex],t=current();
 if(g.type==='delete'){
   const sel=getSelection(),node=sel&&sel.anchorNode,off=sel&&sel.anchorOffset;
   const allowed=e.inputType==='deleteContentForward' && normalize(source.textContent)===normalize(t.word) && sel&&sel.isCollapsed&&node===source.firstChild&&off===t.targetIndex;
   if(!allowed){e.preventDefault(); if(e.inputType==='deleteContentForward') feedback(false,'🔒 Yalnızca işaretli harfi DELETE ile bir kez silebilirsin. Diğer harfler kilitli.');}
 }
 if(g.type==='backspace'){
   const sel=getSelection(),node=sel&&sel.anchorNode,off=sel&&sel.anchorOffset;
   const allowed=e.inputType==='deleteContentBackward' && normalize(source.textContent)===normalize(t.word) && sel&&sel.isCollapsed&&node===source.firstChild&&off===t.targetIndex+1;
   if(!allowed){e.preventDefault(); if(e.inputType==='deleteContentBackward') feedback(false,'🔒 Yalnızca işaretli harfi BACKSPACE ile bir kez silebilirsin. Diğer harfler kilitli.');}
 }
});
source.addEventListener('paste',e=>{if(groups[groupIndex].type==='delete'||groups[groupIndex].type==='backspace'||groups[groupIndex].type==='symbols')e.preventDefault()});source.addEventListener('cut',e=>{if(groups[groupIndex].type==='delete'||groups[groupIndex].type==='backspace')e.preventDefault()});
// Keyboard symbol entry stays in a single editing area. Browser clipboard remains enabled only in copy/cut tasks.
render();
</script>
