<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mouse Ustası</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#7dc9ef;font-family:"Trebuchet MS",Arial,sans-serif}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}

/* Tam olarak oyunun girişinde kullanılan ana sayfa görseli. */
#homeScreen{
 display:none;position:fixed;inset:0;z-index:100;
 background:#7dc9ef url("level1/assets/start-screen.png") center center / 100% 100% no-repeat;
 overflow:hidden;
}
/* Görselin üzerindeki kartların yalnızca tıklanabilir alanları. Görselin kendisi değişmez. */
.homeHit{
 position:absolute;border:0;background:transparent;cursor:pointer;padding:0;
}
.homeHit:hover{background:rgba(255,255,255,.04)}
/* 1536x1024 görsel oranına göre kart alanları */
#hit1{left:29.2%;top:27.7%;width:22.5%;height:52.8%}
#hit2{left:52.2%;top:27.7%;width:22.7%;height:52.8%}
#hit3{left:75.4%;top:27.7%;width:22.5%;height:52.8%}
#transition{display:none;position:fixed;inset:0;z-index:110;align-items:center;justify-content:center;background:#19482d44;pointer-events:none}
.tcard{background:#fff9ed;border:5px solid #b8732a;border-radius:25px;padding:22px 35px;box-shadow:0 12px 30px #0004;text-align:center;color:#57361f;font-size:30px;font-weight:900}
</style>
</head>
<body>
<iframe id="gameFrame" title="Mouse Ustası"></iframe>

<div id="homeScreen" aria-label="Mouse Ustası ana sayfası">
  <button id="hit1" class="homeHit" aria-label="1. Bölüm - Yıldızlara Tıkla" onclick="playLevel(1,true)"></button>
  <button id="hit2" class="homeHit" aria-label="2. Bölüm - Balonları Yakala" onclick="playLevel(2,true)"></button>
  <button id="hit3" class="homeHit" aria-label="3. Bölüm - Hayvanları Bul" onclick="playLevel(3,true)"></button>
</div>

<div id="transition"><div class="tcard" id="transitionText"></div></div>

<script>
const frame=document.getElementById('gameFrame');
const homeScreen=document.getElementById('homeScreen');
const transition=document.getElementById('transition');
const transitionText=document.getElementById('transitionText');
let completedAll=false;
let freePlay=false;

function playLevel(n, fromHome=false){
  if(fromHome) freePlay=true;
  homeScreen.style.display='none';
  frame.style.display='block';
  const names={1:'⭐ 1. Bölüm',2:'🎈 2. Bölüm',3:'🐾 3. Bölüm'};
  transitionText.textContent=names[n]+' başlıyor!';
  transition.style.display='flex';
  /* 1. bölümün kendi başlangıç ekranını atlaması için autostart gönderiyoruz.
     2 ve 3 zaten kendi kaynaklarında oyun başladığında otomatik başlıyor. */
  frame.src='level'+n+'/index.html'+(n===1?'?autostart=1':'');
  setTimeout(()=>transition.style.display='none',450);
}

function showHome(){
  frame.style.display='none';
  homeScreen.style.display='block';
}


window.addEventListener('message',(e)=>{
  const d=e.data||{};
  if(d.type==='goHome'){
    /* Ana sayfa yalnızca tüm bölümler tamamlandıktan sonra serbest seçim ekranıdır. */
    if(completedAll) showHome();
    return;
  }
  if(d.type==='levelComplete'){
    /* İlk oynayışta 1→2→3 sırası korunur.
       Tüm bölümler bittikten sonra seçilen her bölüm bağımsız oynanır
       ve bitince tekrar ana sayfaya dönülür. */
    if(freePlay){
      showHome();
      return;
    }
    if(d.level===1){playLevel(2);return;}
    if(d.level===2){playLevel(3);return;}
    if(d.level===3){completedAll=true;freePlay=true;showHome();return;}
  }
});

/* İlk açılışta oyun her zaman 1. bölümden başlar ve sıralı ilerler. */
freePlay=false;
playLevel(1);
</script>
</body>
</html>
