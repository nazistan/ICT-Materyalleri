<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günlük Yaşam ve Teknoloji | Hafıza Oyunu</title><style>
:root{--ink:#15385f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 12% 10%,#fff9,transparent 35%),linear-gradient(135deg,#a7e4f2,#e5f5ee 48%,#ffdfaa);overflow-x:hidden}.room{min-height:100vh;padding:clamp(10px,2vw,26px);position:relative;isolation:isolate}.room:before{content:"";position:fixed;inset:0;z-index:-2;background:repeating-linear-gradient(90deg,#ffffff12 0 2px,transparent 2px 120px)}.room:after{content:"";position:fixed;left:0;right:0;bottom:0;height:14vh;z-index:-1;background:linear-gradient(#eab76f,#c77c3f 14%,#e4a15b 22%,#bd743a);border-top:8px solid #f5d19b;box-shadow:0 -8px 22px #7a4b2933}.app{width:min(1220px,100%);margin:auto}.top{display:grid;grid-template-columns:1.2fr auto 1fr;gap:15px;align-items:center;margin-bottom:18px}.brand{position:relative;padding:14px 18px;background:linear-gradient(#ffd38a,#d98b43);border:3px solid #a9632b;border-radius:22px;box-shadow:0 7px 0 #874a26,0 13px 24px #234e5b30}.brand h1{margin:0;text-align:center;line-height:1;font-size:clamp(22px,3vw,38px);font-weight:1000;color:white;text-shadow:0 3px #164578,2px 4px #164578}.brand span{display:block;color:#ffda49;margin-top:5px;text-shadow:0 3px #9d5b12,2px 4px #9d5b12}.timer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#ffd85d,#ffab1c);border:3px solid #c98216;border-radius:20px;box-shadow:0 6px 0 #a35c19;white-space:nowrap}.clock{font-size:28px}.time{background:#14345f;color:white;font-size:clamp(23px,2.5vw,32px);font-weight:900;padding:8px 14px;border-radius:12px;min-width:105px;text-align:center}.instruction{padding:16px;background:linear-gradient(#fffdf7,#fff0d6);border:3px solid #e8cda0;border-radius:28px;box-shadow:0 6px 0 #c69d6a;text-align:center;font-size:clamp(14px,1.5vw,19px);font-weight:900}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.pill{padding:9px 15px;border-radius:999px;background:#ffffffdf;border:2px solid #d4e7f4;box-shadow:0 3px #a9c9dc;font-weight:900}.pill strong{color:#0879d4;font-size:18px}.frame{padding:clamp(8px,1.2vw,15px);border-radius:26px;background:linear-gradient(145deg,#fff8e8,#f4d5a6);border:4px solid #f8edcf;box-shadow:0 10px #ad6a39,0 20px 38px #214e5b40,inset 0 0 0 2px #d8a45d}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(7px,1vw,13px)}.card{position:relative;aspect-ratio:1.2/1;border:0;background:transparent;padding:0;perspective:900px;cursor:pointer;min-width:0}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.8,.2,1)}.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:18px;backface-visibility:hidden;overflow:hidden;border:3px solid #fff7e9;box-shadow:0 5px #b5a58b,0 7px 13px #173b5a26}.back{background:linear-gradient(145deg,#3bbaff,#0879d8 70%,#0966c3);border-color:#d9f4ff;box-shadow:inset 0 0 0 3px #0b7bd0,inset 0 0 0 5px #6ed0ff,0 5px #9d8c76}.back:before{content:"";position:absolute;inset:8px;border:1.5px solid #ffffff54;border-radius:13px;background-image:radial-gradient(circle at 15% 18%,#ffffff20 0 2px,transparent 3px),radial-gradient(circle at 85% 80%,#ffffff22 0 2px,transparent 3px);background-size:28px 28px}.back:after{content:"";position:absolute;width:62%;height:62%;border-radius:50%;border:1px solid #bdeaff30;box-shadow:0 0 0 10px #bdeaff0c,0 0 0 21px #bdeaff0b}.question{z-index:1;font-size:clamp(43px,5.3vw,76px);font-weight:900;color:white;text-shadow:0 4px #1672bf,0 6px 7px #064b8a66;line-height:1}.front{transform:rotateY(180deg);background:linear-gradient(145deg,#fffef8,#fff0cf);box-shadow:inset 0 0 0 2px #e8cf9b,0 5px #b5a58b;padding:6px}.front img{width:100%;height:100%;object-fit:contain;border-radius:10px;mix-blend-mode:multiply}.matched .front{border-color:#8ce7bd;box-shadow:inset 0 0 0 3px #b6f4d4,0 0 0 2px #39c98a,0 5px #6aa987}.matched .front:after{content:"✓";position:absolute;top:5px;right:6px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#2ac783;color:white;font-weight:1000}.card:disabled{cursor:default}.card:not(.matched):hover .back{filter:brightness(1.08)}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0 8px}.btn{border:0;border-radius:15px;padding:13px 22px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 5px #a16b2f,0 8px 16px #173b5a28}.primary{color:#173354;background:linear-gradient(#ffe16b,#ffb52d);border:2px solid #f8d277}.secondary{color:white;background:linear-gradient(#2ba7f4,#0873d1);border:2px solid #c3edff;box-shadow:0 5px #07549b}.note{text-align:center;color:#244e6e;font-weight:800;margin:14px 0 5px;font-size:13px}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#082b4dbb;backdrop-filter:blur(7px);z-index:10}.overlay.show{display:flex}.modal{width:min(520px,100%);padding:30px;border-radius:28px;background:linear-gradient(145deg,#fffdf6,#ffedc9);border:4px solid white;box-shadow:0 18px 60px #001a35a6;text-align:center}.emoji{font-size:62px}.modal h2{font-size:clamp(28px,4vw,40px);margin:10px 0}.modal p{font-size:18px;font-weight:800;line-height:1.45}@media(max-width:900px){.top{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1;max-width:560px;width:100%;justify-self:center}.instruction{grid-column:1/-1;grid-row:2}.timer{grid-column:1/-1;grid-row:3;justify-self:center}.card{aspect-ratio:1/1}}@media(max-width:560px){.room{padding:10px 8px 22px}.brand{padding:12px}.timer{padding:7px 10px}.clock{font-size:22px}.time{font-size:23px}.frame{padding:7px;border-radius:18px}.board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{aspect-ratio:1.08/1}.face{border-radius:13px;border-width:2px}.front{padding:4px}.question{font-size:clamp(44px,13vw,66px)}.pill{padding:7px 11px;font-size:13px}.btn{padding:11px 16px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* Compact viewport layout: keep the full board and controls visible on laptop screens */
@media (min-width: 901px) and (max-height: 850px) {
  .room { padding: 8px 18px 10px; }
  .topbar { gap: 10px; margin-bottom: 9px; }
  .brand { padding: 8px 18px 10px; border-radius: 17px; }
  .brand h1 { font-size: clamp(21px, 2.25vw, 30px); }
  .timerbox { gap: 8px; padding: 6px 10px; border-radius: 16px; }
  .clock { width: 40px; height: 40px; font-size: 22px; border-width: 3px; }
  .time { min-width: 88px; padding: 6px 10px; font-size: 23px; }
  .instruction { padding: 10px 13px; font-size: clamp(13px, 1.2vw, 16px); }
  .status { gap: 7px; margin-bottom: 9px; }
  .pill { padding: 5px 11px; font-size: 13px; }
  .pill strong { font-size: 16px; }
  .board-shell { padding: 8px; border-radius: 20px; }
  .board { gap: 8px; }
  .card { aspect-ratio: 1.48 / 1; }
  .face { border-radius: 14px; border-width: 2px; }
  .front { padding: 5px; }
  .question { font-size: clamp(38px, 4vw, 58px); }
  .controls { gap: 9px; margin: 13px 0 4px; }
  .btn { padding: 9px 16px; font-size: 14px; }
  .footnote { margin: 7px 0 0; font-size: 12px; }
}
@media (min-width: 901px) and (max-height: 700px) {
  .room { padding-top: 5px; padding-bottom: 5px; }
  .topbar { grid-template-columns: minmax(200px, 1.1fr) auto minmax(200px, 1fr); margin-bottom: 6px; }
  .brand h1 { font-size: 21px; }
  .status { margin-bottom: 6px; }
  .board-shell { padding: 6px; }
  .board { gap: 6px; }
  .card { aspect-ratio: 1.7 / 1; }
  .controls { margin-top: 9px; }
  .footnote { display: none; }
}


body.level-two .timer{display:none}
body.level-two .topbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
body.level-two .board{grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(4px,.55vw,7px)}
body.level-two .card{aspect-ratio:1.22/1}
body.level-two .face{border-radius:11px}
body.level-two .front{padding:3px}
@media(min-width:901px) and (max-height:850px){
 body.level-two .room{padding:5px 14px}
 body.level-two .topbar{margin-bottom:5px;gap:8px}
 body.level-two .brand{padding:6px 14px 8px}
 body.level-two .brand h1{font-size:clamp(20px,2vw,27px)}
 body.level-two .instruction{padding:8px 12px;font-size:14px}
 body.level-two .stats{margin-bottom:6px;gap:6px}
 body.level-two .pill{padding:4px 9px;font-size:12px}
 body.level-two .frame{padding:6px;border-radius:16px}
 body.level-two .board{gap:5px}
 body.level-two .card{aspect-ratio:1.55/1}
 body.level-two .face{border-radius:9px}
 body.level-two .controls{margin:8px 0 2px}
 body.level-two .btn{padding:7px 13px;font-size:13px}
 body.level-two .footnote{display:none}
}
@media(max-width:900px){
 body.level-two .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
 body.level-two .card{aspect-ratio:1.1/1}
}
@media(max-width:560px){
 body.level-two .room{padding:8px 6px}
 body.level-two .topbar{grid-template-columns:1fr}
 body.level-two .instruction{grid-column:auto}
 body.level-two .brand{max-width:100%}
 body.level-two .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
 body.level-two .card{aspect-ratio:.95/1}
 body.level-two .face{border-radius:8px}
 body.level-two .stats{gap:4px}
 body.level-two .pill{padding:5px 7px;font-size:11px}
}
