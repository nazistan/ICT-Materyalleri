<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>10 Kasım – Saygı ve Özlemle</title>
<style>
:root{--wine:#650d14;--gold:#d9ad59;--cream:#fff8ec;--ink:#3e2925}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#39080d}
.app{width:100vw;height:100dvh;display:grid;grid-template-rows:clamp(42px,6.5vh,66px) minmax(0,1fr);gap:8px;padding:8px;background:radial-gradient(ellipse at center,#8b1b20,#3d070c)}
header{display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);border-radius:13px;background:linear-gradient(90deg,#690a11,#b71e28,#690a11);color:#fff2d5;font:700 clamp(16px,2.1vw,27px) Georgia;letter-spacing:.1em;text-shadow:0 2px 3px #400}
.main{min-height:0;display:grid;grid-template-columns:minmax(145px,15vw) minmax(0,1fr) minmax(155px,17vw);gap:8px}
.panel,.stage{min-height:0;min-width:0;border:2px solid #d9b87e;border-radius:13px;background:linear-gradient(150deg,#fffdf8,#ead5b9);box-shadow:0 4px 14px #16030488}
.panel{padding:clamp(5px,.7vw,10px);display:flex;flex-direction:column;gap:clamp(4px,.65vh,8px);overflow:hidden}
.panel h3{margin:0;text-align:center;font-size:clamp(9px,.85vw,12px);letter-spacing:.07em;color:#71302b}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.tool{height:clamp(36px,6.5vh,58px);border:1px solid #c9a98b;border-radius:9px;background:linear-gradient(#fff,#f0dfd1);cursor:pointer;display:grid;place-items:center;padding:4px}
.tool svg{width:80%;height:80%}.tool.active{outline:2px solid #bf8527;background:#fff0b8}
.colors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.swatch{height:clamp(20px,4.2vh,34px);border-radius:50%;border:2px solid white;box-shadow:0 1px 4px #5b281f88;cursor:pointer;min-width:0}.swatch.sel{outline:2px solid #48211c}
.gradient{height:clamp(14px,2.5vh,22px);border-radius:12px;background:linear-gradient(90deg,#e11d2e,#ff8a00,#ffe32d,#39b54a,#00c9d8,#2454e8,#8c39d5,#ec3fa5);border:2px solid white;cursor:pointer}
.effects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.effect{height:clamp(26px,4.5vh,38px);border:1px solid #c9a98b;border-radius:7px;cursor:pointer;background:linear-gradient(135deg,#fff,#ead9c8);font-size:10px;font-weight:bold;color:#65332d}
.stage{position:relative;overflow:hidden;background:radial-gradient(circle,#fffdf8,#e7d4bb)}
#art{width:100%;height:100%;display:block;touch-action:none}
.ray{stroke:#2b1c18;stroke-width:3.2;stroke-linejoin:round;cursor:pointer}
.ray:hover{stroke:#b27b29;stroke-width:4}
#decor .placed{cursor:move;filter:drop-shadow(0 2px 2px #40201566)}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.sticker{height:clamp(42px,7.4vh,65px);border:1px solid #c9a36f;border-radius:10px;background:linear-gradient(145deg,#fffefb 0%,#f7e8d3 58%,#e9cfaa 100%);box-shadow:inset 0 1px 0 #fff,0 2px 5px #5c321b25;cursor:grab;padding:3px;display:grid;place-items:center;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.sticker{min-width:0;min-height:0;overflow:hidden;padding:4px}.sticker svg{display:block;width:100%;height:100%;overflow:hidden;filter:drop-shadow(0 1px 1px #55351d22)}.sticker:hover{transform:translateY(-2px);border-color:#a96d2d;box-shadow:inset 0 1px 0 #fff,0 4px 9px #5c321b35}.sticker:active{transform:scale(.96)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.word{border:1px solid #c99c51;border-radius:7px;padding:6px 2px;background:linear-gradient(#fff9e8,#e8c98e);font:700 clamp(9px,.8vw,12px) Georgia;color:#6b211f;cursor:pointer}
.save{margin-top:auto;border:2px solid #f3d278;border-radius:9px;background:linear-gradient(#39bd5c,#08752d);color:white;font-weight:800;font-size:clamp(12px,1.2vw,16px);padding:clamp(8px,1.4vh,13px) 4px;cursor:pointer;box-shadow:0 3px 0 #064d20}
.hint{font-size:9px;color:#866c5c;text-align:center;line-height:1.2}
@media(max-width:700px){.main{grid-template-columns:112px minmax(0,1fr) 125px;gap:5px}.app{padding:5px;gap:5px}.panel{padding:4px}.gallery{gap:3px}.sticker{height:clamp(34px,6.2vh,48px)}}
@media(max-height:600px){.main{grid-template-columns:130px minmax(0,1fr) 145px}.tool{height:34px}.sticker{height:36px}.panel{gap:3px}.colors{gap:3px}.swatch{height:18px}}

.monument-feature{width:100%;height:clamp(82px,15vh,118px);min-height:72px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;border:1px solid #c9a36f;border-radius:9px;background:linear-gradient(145deg,#fffefb,#f2dfc6);box-shadow:inset 0 1px 0 #fff,0 2px 5px #5c321b25;padding:4px;cursor:grab}
.monument-feature img{display:block;width:100%;height:calc(100% - 17px);object-fit:contain;object-position:center}
.monument-feature span{font:700 11px Georgia;color:#71302b;line-height:14px}
.monument-feature:active{transform:scale(.99)}
@media(max-height:600px){.monument-feature{height:70px;min-height:64px}}

#selectionUI{pointer-events:none}#selectionUI .handle,#selectionUI .rotate-handle{pointer-events:all}
#selectionUI .selbox{fill:none;stroke:#1769e8;stroke-width:2;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
#selectionUI .handle{fill:#fff;stroke:#1769e8;stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:all;cursor:nwse-resize}
#selectionUI .rotate-line{stroke:#1769e8;stroke-width:2;vector-effect:non-scaling-stroke}
#selectionUI .rotate-handle{fill:#1769e8;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:all;cursor:grab}
</style></head><body>

</div>
<h3>RENK PALETİ</h3><div class="colors" id="colors"></div>

<script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('art'),rays=document.getElementById('rays'),decor=document.getElementById('decor');
const cx=450,cy=350,inner=194,outer=345,N=24;function polar(r,a){return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
for(let i=0;i<N;i++){let a0=-Math.PI/2+i*2*Math.PI/N+.012,a1=-Math.PI/2+(i+1)*2*Math.PI/N-.012,p1=polar(inner,a0),p2=polar(outer,a0),p3=polar(outer,a1),p4=polar(inner,a1),el=document.createElementNS(NS,'path');el.setAttribute('d',`M${p1} L${p2} A${outer} ${outer} 0 0 1 ${p3} L${p4} A${inner} ${inner} 0 0 0 ${p1}Z`);el.setAttribute('fill','#fff');el.setAttribute('class','ray');el.id='ray-segment-'+i;el.dataset.i=i;el.addEventListener('click',()=>{if(tool==='fill')fillRay(el)});rays.appendChild(el)}
let tool='fill',color='#d62828',effect='soft',history=[],isSpraying=false,sprayTimer=null,paintLayer=document.createElementNS(NS,'g');paintLayer.id='paint';svg.insertBefore(paintLayer,decor);
const palette=['#d62828','#ef7d22','#ffd22e','#35a853','#8bcf45','#25b9d0','#2368d8','#873bd1','#ed65a5','#7a431f','#222222','#ffffff'];
palette.forEach((c,i)=>{let b=document.createElement('button');b.className='swatch'+(!i?' sel':'');b.style.background=c;b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};document.getElementById('colors').appendChild(b)});
function fillRay(el){history.push({type:'fill',el,old:el.getAttribute('fill')});el.setAttribute('fill',color)}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
 const requested=b.dataset.tool;
 if(requested==='eraser'&&clickedSticker&&clickedSticker.isConnected){
  const target=clickedSticker;
  const index=history.findIndex(item=>item.type==='sticker'&&item.el===target);
  target.remove();
  if(index>=0)history.splice(index,1);
  clearSelection();
  tool='fill';
  document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x.dataset.tool==='fill'));
  document.getElementById('hint').textContent='Seçili grafik bileşeni silindi.';
  return;
 }
 tool=requested;
 document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));
 document.getElementById('hint').textContent=tool==='spray'?'Sprey için tuvalde sol tuşa basılı tut.':tool==='brush'?'Çizmek için tuvalde basılı tut ve sürükle.':tool==='eraser'?'Boyalı alanları silmek için üzerlerine tıkla veya sürükle.':'Renk seçip ışınlara dokun.';
});
document.querySelectorAll('[data-effect]').forEach(b=>b.onclick=()=>{effect=b.dataset.effect;document.querySelectorAll('[data-effect]').forEach(x=>x.style.outline=x===b?'2px solid #a66a23':'none')});
document.getElementById('gradient').onclick=()=>{color='url(#rainbow)';let defs=svg.querySelector('defs');if(!svg.querySelector('#rainbow')){let g=document.createElementNS(NS,'linearGradient');g.id='rainbow';['#e11d2e','#ff8a00','#ffe32d','#39b54a','#00c9d8','#2454e8','#8c39d5'].forEach((c,i)=>{let st=document.createElementNS(NS,'stop');st.setAttribute('offset',(i/6*100)+'%');st.setAttribute('stop-color',c);g.appendChild(st)});defs.appendChild(g)}document.getElementById('hint').textContent='Renk geçişi seçildi.'};
function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}

let sprayTarget=null;
function sprayAt(e){
 if(!sprayTarget)return;
 const p=point(e),g=document.createElementNS(NS,'g');
 const clipId='spray-clip-'+Math.random().toString(36).slice(2);
 const defsNode=svg.querySelector('defs');
 const cp=document.createElementNS(NS,'clipPath');cp.setAttribute('id',clipId);cp.setAttribute('clipPathUnits','userSpaceOnUse');
 const shape=sprayTarget.cloneNode(false);shape.removeAttribute('class');shape.removeAttribute('id');cp.appendChild(shape);defsNode.appendChild(cp);
 g.setAttribute('clip-path',`url(#${clipId})`);
 const count=effect==='glitter'?34:effect==='dots'?18:90;
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const radius=effect==='soft'?Math.random()*34:Math.random()*24;
  const x=p.x+Math.cos(a)*radius,y=p.y+Math.sin(a)*radius;
  if(effect==='glitter'){
   const star=document.createElementNS(NS,'path');
   const r=1.5+Math.random()*2.8;
   star.setAttribute('d',`M${x} ${y-r*2} L${x+r*.45} ${y-r*.45} L${x+r*2} ${y} L${x+r*.45} ${y+r*.45} L${x} ${y+r*2} L${x-r*.45} ${y+r*.45} L${x-r*2} ${y} L${x-r*.45} ${y-r*.45}Z`);
   star.setAttribute('fill',i%4===0?'#fff4b8':color);star.setAttribute('opacity',.65+Math.random()*.35);g.appendChild(star);
  }else{
   const dot=document.createElementNS(NS,'circle');
   dot.setAttribute('cx',x);dot.setAttribute('cy',y);
   dot.setAttribute('r',effect==='dots'?2.4+Math.random()*2.2:1.2+Math.random()*3.4);
   dot.setAttribute('fill',color);dot.setAttribute('opacity',effect==='dots'?.75+Math.random()*.25:.035+Math.random()*.10);
   g.appendChild(dot);
  }
 }
 paintLayer.appendChild(g);history.push({type:'spray',el:g,clip:cp});
}
let drawing=false,last=null;
svg.addEventListener('pointerdown',e=>{
 if(e.target.closest('#decor'))return;
 last=point(e);
 if(tool==='spray'){
  // Spray is restricted to the single sun-ray segment where the press begins.
  sprayTarget=e.target.closest('.ray');
  if(!sprayTarget)return;
  drawing=true;sprayAt(e);sprayTimer=setInterval(()=>{if(drawing)sprayAt(e)},95);
 }else if(tool==='brush'){
  drawing=true;let path=document.createElementNS(NS,'path');
  path.setAttribute('d',`M${last.x},${last.y}`);path.setAttribute('stroke',color);
  path.setAttribute('stroke-width','5');path.setAttribute('stroke-linecap','round');path.setAttribute('fill','none');
  paintLayer.appendChild(path);history.push({type:'brush',el:path});window.currentPath=path;
 }else if(tool==='eraser'){drawing=true;eraseNear(last)}
});
svg.addEventListener('pointermove',e=>{
 if(!drawing)return;let p=point(e);
 if(tool==='spray'){if(sprayTarget)sprayAt(e)}
 else if(tool==='brush'&&window.currentPath)window.currentPath.setAttribute('d',window.currentPath.getAttribute('d')+` L${p.x},${p.y}`);
 else if(tool==='eraser')eraseNear(p);
 last=p;
});
function stopDraw(){drawing=false;window.currentPath=null;sprayTarget=null;if(sprayTimer)clearInterval(sprayTimer);sprayTimer=null}
svg.addEventListener('pointerup',stopDraw);svg.addEventListener('pointerleave',stopDraw);window.addEventListener('pointerup',stopDraw);
function pointHitsElement(el,p){
 if(!el||!el.isConnected)return false;
 const tag=el.tagName.toLowerCase();
 if(tag==='g'){
  const children=[...el.children];
  for(let i=children.length-1;i>=0;i--)if(pointHitsElement(children[i],p))return true;
  return false;
 }
 let ctm=el.getScreenCTM(),svgCtm=svg.getScreenCTM();
 if(!ctm||!svgCtm)return false;
 const screenPoint=svg.createSVGPoint();screenPoint.x=p.x;screenPoint.y=p.y;
 const clientPoint=svg.createSVGPoint();
 // Convert SVG user-space point to screen, then into the tested element's local coordinates.
 const screen=screenPoint.matrixTransform(svgCtm);
 const local=screen.matrixTransform(ctm.inverse());
 try{
  if(tag==='path'){
   const fill=el.getAttribute('fill');
   if(fill&&fill!=='none'&&el.isPointInFill(local))return true;
   return el.isPointInStroke(local);
  }
  if(tag==='circle'||tag==='ellipse'||tag==='rect'||tag==='polygon'||tag==='polyline'){
   return el.isPointInFill(local)||el.isPointInStroke(local);
  }
  if(tag==='image'||tag==='text'){
   const b=el.getBBox();return local.x>=b.x&&local.x<=b.x+b.width&&local.y>=b.y&&local.y<=b.y+b.height;
  }
 }catch(err){return false}
 return false;
}
function eraseNear(p){
 // Remove exactly the latest visible operation under the eraser, preserving earlier layers.
 for(let i=history.length-1;i>=0;i--){
  const item=history[i];if(!item||!item.el||!item.el.isConnected)continue;
  if(item.type==='fill'){
   if(pointHitsElement(item.el,p)){
    item.el.setAttribute('fill',item.old??'#fff');history.splice(i,1);return;
   }
  }else if(pointHitsElement(item.el,p)){
   item.el.remove();if(item.clip)item.clip.remove();history.splice(i,1);return;
  }
 }
}
document.getElementById('undo').onclick=()=>{let h=history.pop();if(!h)return;if(h.type==='fill')h.el.setAttribute('fill',h.old);else h.el.remove();if(h.clip)h.clip.remove()};

let selectionHideTimer=null;

function hideSelectionNow(){

 selectionUI.innerHTML='';

}
function scheduleHideSelection(){
 clearTimeout(selectionHideTimer);

}
function clearSelection(){
 clearTimeout(selectionHideTimer);
 selectionUI.innerHTML='';

 selectionLocked=false;
}
function updateSelection(){
 selectionUI.innerHTML='';
 if(!selectedSticker || !selectedSticker.isConnected)return;
 const bb=selectedSticker.getBBox(), elScreen=selectedSticker.getScreenCTM(), svgScreen=svg.getScreenCTM();
 if(!elScreen||!svgScreen)return;

   const q=svg.createSVGPoint();q.x=x;q.y=y;return q.matrixTransform(elScreen).matrixTransform(toSvg);
 });
 const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x));
 const minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));
 const cx=(minX+maxX)/2,topY=minY-22;
 selectionUI.innerHTML=`<rect class="selbox" x="${minX}" y="${minY}" width="${Math.max(1,maxX-minX)}" height="${Math.max(1,maxY-minY)}"/><line class="rotate-line" x1="${cx}" y1="${minY}" x2="${cx}" y2="${topY}"/><circle class="rotate-handle" cx="${cx}" cy="${topY}" r="7"/><circle class="handle" cx="${minX}" cy="${minY}" r="5"/><circle class="handle" cx="${maxX}" cy="${minY}" r="5"/><circle class="handle" cx="${maxX}" cy="${maxY}" r="5"/><circle class="handle" cx="${minX}" cy="${maxY}" r="5"/>`;

}
let transformState=null;
function beginTransform(e,mode,corner=2){
 e.preventDefault();e.stopPropagation();if(!selectedSticker)return;

 // Keep the object's center fixed in the parent SVG coordinate system.
 const centerX=m.a*localCx+m.c*localCy+m.e;

  mode,base:m,cx:centerX,cy:centerY,localCx,localCy,

function erasePlacedAt(p){
 for(let i=history.length-1;i>=0;i--){
  const item=history[i];
  if(!item||item.type!=='sticker'||!item.el||!item.el.isConnected)continue;
  if(pointHitsElement(item.el,p)){
   item.el.remove();

function makeMove(el){

  if(!selectionLocked&&selectedSticker===el){clearSelection();return;}
  selectionPointerInside=false;scheduleHideSelection();

  e.preventDefault();e.stopPropagation();clearTimeout(selectionHideTimer);

  if(!moving)return;
  const p=point(e),dx=p.x-start.x,dy=p.y-start.y;

  else{el.setAttribute('transform',`matrix(${base.a} ${base.b} ${base.c} ${base.d} ${base.e+dx} ${base.f+dy})`)}
